name: Documentation
description: 문서 작성 또는 수정 작업을 등록합니다.
title: "[Doc] "

body:
  - type: markdown
    attributes:
      value: |
        ## 문서 작업 등록 안내
        - 작성하거나 수정해야 할 문서의 범위를 명확하게 작성해주세요.
        - 관련 기능이나 버그가 있다면 Issue 또는 Asana 링크를 남겨주세요.
        - 문서 검토가 필요한 경우 검토 기준을 완료 조건에 작성해주세요.

  - type: dropdown
    id: product
    attributes:
      label: 제품
      description: 문서가 적용되는 제품을 선택해주세요.
      options:
        - DuckHex
    validations:
      required: true

  - type: dropdown
    id: document_type
    attributes:
      label: 문서 유형
      description: 작성하거나 수정할 문서의 유형을 선택해주세요.
      options:
        - 사용자 매뉴얼
        - 개발 문서
        - API 문서
        - 설치 및 배포 문서
        - 테스트 문서
        - README
        - 기타
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: 관련 작업
      description: 관련 Asana Task, GitHub Issue 또는 Pull Request 링크를 입력해주세요.
      placeholder: https://app.asana.com/... 또는 #123

  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 문서를 작성하거나 수정하는 이유를 작성해주세요.
      placeholder: 신규 검색 기능 추가에 따라 사용자 매뉴얼을 수정합니다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 내용
      description: 작성하거나 수정해야 하는 내용을 구체적으로 작성해주세요.
      placeholder: |
        예시)
        - 검색 기능 사용 방법 추가
        - 검색 조건과 제한사항 설명
        - 검색 화면 이미지 추가
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 문서 작업의 완료 기준을 작성해주세요.
      placeholder: |
        - [ ] 필요한 내용이 모두 반영되었다.
        - [ ] 화면 및 기능 명칭이 실제 프로그램과 일치한다.
        - [ ] 오탈자와 잘못된 설명을 검토했다.
        - [ ] 관련 담당자의 검토를 완료했다.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 기존 문서, 이미지, 기획 자료 또는 참고 링크를 첨부해주세요.