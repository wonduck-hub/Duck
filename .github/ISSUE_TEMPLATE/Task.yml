name: Development Task
description: 개발 작업을 등록합니다.
title: "[Task] "
type: Task

body:
  - type: markdown
    attributes:
      value: |
        ## 개발 작업 등록 안내
        - Asana에서 기획이 완료된 작업만 등록합니다.
        - 하나의 Task는 하나의 작업만 수행하도록 작성합니다.
        - 구현 방법보다 작업 목표를 명확하게 작성해주세요.

  - type: dropdown
    id: product
    attributes:
      label: 제품
      options:
        - DuckHex
        - DAPI
        - 미정
    validations:
      required: true

  - type: input
    id: asana
    attributes:
      label: 관련 Asana
      description: 관련 Asana Task 또는 프로젝트 링크
      placeholder: https://app.asana.com/...

  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 구현해야 하는 작업을 작성해주세요.
      placeholder: |
        예시)
        - Hex Viewer에서 선택 영역 표시 기능 구현
        - BinaryReader에 Seek 기능 추가
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 완료되었다고 판단하는 기준을 작성해주세요.
      placeholder: |
        - [ ] 기능이 정상 동작한다.
        - [ ] 예외 상황을 처리하였다.
        - [ ] 코드 리뷰를 완료하였다.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 문서, 디자인, 관련 링크 등을 작성해주세요.