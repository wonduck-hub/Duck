name: Weekly DuckChat analysis

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 00:00 UTC (한국 시간 월요일 09:00)
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build and generate SARIF
        id: analysis
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null

          $timestamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmmss')
          $projectFolderName = "DuckChat_$timestamp"
          $artifactDirectory = Join-Path (Resolve-Path artifacts).Path $timestamp
          $projectDirectory = Join-Path $artifactDirectory $projectFolderName
          New-Item -ItemType Directory -Force $projectDirectory | Out-Null

          $sarifFileName = "DuckChat_sarif_$timestamp.sarif"
          $sarifRelativePath = "artifacts/$timestamp/$projectFolderName/$sarifFileName"
          $sarifFullPath = Join-Path $projectDirectory $sarifFileName
          "timestamp=$timestamp" >> $env:GITHUB_OUTPUT
          "artifact_name=duck_sarif_$timestamp" >> $env:GITHUB_OUTPUT
          "sarif_path=$sarifRelativePath" >> $env:GITHUB_OUTPUT

          dotnet build Duck\DuckChat\DuckChat.csproj `
            --configuration Release `
            -p:EnforceCodeStyleInBuild=true `
            -p:PublishTrimmed=false `
            -p:GenerateDocumentationFile=true `
            "-p:ErrorLog=$sarifFullPath,version=2.1"

      - name: Set up Python
        if: always() && steps.analysis.outputs.sarif_path != '' && hashFiles(steps.analysis.outputs.sarif_path) != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Upload SARIF ZIP to OneDrive
        if: always() && steps.analysis.outputs.sarif_path != '' && hashFiles(steps.analysis.outputs.sarif_path) != ''
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python SarifOneDrive/scripts/upload_sarif_to_onedrive.py --sarif "${{ steps.analysis.outputs.sarif_path }}"

      - name: Store SARIF artifact
        if: always() && steps.analysis.outputs.sarif_path != '' && hashFiles(steps.analysis.outputs.sarif_path) != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.analysis.outputs.artifact_name }}
          path: artifacts/${{ steps.analysis.outputs.timestamp }}/**
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload SARIF to GitHub Code scanning
        if: always() && steps.analysis.outputs.sarif_path != '' && hashFiles(steps.analysis.outputs.sarif_path) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.analysis.outputs.sarif_path }}
          category: duckchat-csharp
