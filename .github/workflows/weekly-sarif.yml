name: Weekly DuckChat analysis

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 00:00 UTC (한국 시간 월요일 09:00)
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build and generate SARIF
        id: analysis
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null

          $timestamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmmss')
          $projectFolderName = "DuckChat_$timestamp"
          $artifactDirectory = Join-Path (Resolve-Path artifacts).Path $timestamp
          $projectDirectory = Join-Path $artifactDirectory $projectFolderName
          New-Item -ItemType Directory -Force $projectDirectory | Out-Null

          $sarifFileName = "DuckChat_sarif_$timestamp.sarif"
          $sarifRelativePath = "artifacts/$timestamp/$projectFolderName/$sarifFileName"
          $sarifFullPath = Join-Path $projectDirectory $sarifFileName
          $compilerResponseFilePath = Join-Path $env:RUNNER_TEMP "sarif-compiler-$timestamp.rsp"
          $errorLogArgument = '/errorlog:"{0},version=2.1"' -f $sarifFullPath
          [System.IO.File]::WriteAllText(
            $compilerResponseFilePath,
            $errorLogArgument,
            [System.Text.UTF8Encoding]::new($false)
          )
          "timestamp=$timestamp" >> $env:GITHUB_OUTPUT
          "artifact_name=duck_sarif_$timestamp" >> $env:GITHUB_OUTPUT
          "sarif_path=$sarifRelativePath" >> $env:GITHUB_OUTPUT

          dotnet build Duck\DuckChat\DuckChat.csproj `
            --configuration Release `
            -p:EnforceCodeStyleInBuild=true `
            -p:PublishTrimmed=false `
            -p:GenerateDocumentationFile=true `
            "-p:CompilerResponseFile=$compilerResponseFilePath"

      - name: Validate SARIF format version
        id: validate_sarif
        if: always() && steps.analysis.outputs.sarif_path != '' && hashFiles(steps.analysis.outputs.sarif_path) != ''
        shell: pwsh
        env:
          SARIF_FILE_PATH: ${{ steps.analysis.outputs.sarif_path }}
        run: |
          try {
            $sarifDocument = Get-Content -Raw -Encoding utf8 -LiteralPath $env:SARIF_FILE_PATH | ConvertFrom-Json -ErrorAction Stop
          }
          catch {
            throw "Generated SARIF is not valid JSON: $($_.Exception.Message)"
          }
          $supportedSarifVersions = @('1.0.0', '2.1.0')
          if ($null -eq $sarifDocument -or $supportedSarifVersions -cnotcontains [string]$sarifDocument.version) {
            $actualVersion = if ($null -eq $sarifDocument) { '<invalid JSON>' } else { [string]$sarifDocument.version }
            throw "Expected SARIF version 1.0.0 or 2.1.0, got '$actualVersion'. Refusing to upload SARIF."
          }
          if ($null -eq $sarifDocument.runs -or $sarifDocument.runs -isnot [System.Array]) {
            throw "Generated SARIF document must contain a runs array. Refusing to upload SARIF."
          }
          "valid=true" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        if: always() && steps.validate_sarif.outputs.valid == 'true' && steps.analysis.outputs.sarif_path != '' && hashFiles(steps.analysis.outputs.sarif_path) != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Upload SARIF ZIP to OneDrive
        if: always() && steps.validate_sarif.outputs.valid == 'true' && steps.analysis.outputs.sarif_path != '' && hashFiles(steps.analysis.outputs.sarif_path) != ''
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          SARIF_TIMESTAMP: ${{ steps.analysis.outputs.timestamp }}
        run: python SarifOneDrive/scripts/upload_sarif_to_onedrive.py --sarif "${{ steps.analysis.outputs.sarif_path }}"

      - name: Store SARIF artifact
        if: always() && steps.validate_sarif.outputs.valid == 'true' && steps.analysis.outputs.sarif_path != '' && hashFiles(steps.analysis.outputs.sarif_path) != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.analysis.outputs.artifact_name }}
          path: artifacts/${{ steps.analysis.outputs.timestamp }}/**
          if-no-files-found: ignore
          retention-days: 90
