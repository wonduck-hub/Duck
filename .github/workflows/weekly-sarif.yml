name: Weekly DuckChat analysis

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 00:00 UTC (한국 시간 월요일 09:00)
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build and generate SARIF
        id: analysis
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null

          $timestamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmmss')
          $sarifRelativePath = "artifacts/duckchat-$timestamp.sarif"
          $sarifFullPath = Join-Path (Resolve-Path artifacts).Path "duckchat-$timestamp.sarif"
          "timestamp=$timestamp" >> $env:GITHUB_OUTPUT
          "sarif_path=$sarifRelativePath" >> $env:GITHUB_OUTPUT

          dotnet build Duck\DuckChat\DuckChat.csproj `
            --configuration Release `
            -p:EnforceCodeStyleInBuild=true `
            -p:PublishTrimmed=false `
            -p:GenerateDocumentationFile=true `
            "-p:ErrorLog=$sarifFullPath,version=2.1"

      - name: Store SARIF artifact
        if: always() && steps.analysis.outputs.sarif_path != '' && hashFiles(steps.analysis.outputs.sarif_path) != ''
        uses: actions/upload-artifact@v4
        with:
          name: duckchat-sarif-${{ steps.analysis.outputs.timestamp }}
          path: ${{ steps.analysis.outputs.sarif_path }}
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload SARIF to GitHub Code scanning
        if: always() && steps.analysis.outputs.sarif_path != '' && hashFiles(steps.analysis.outputs.sarif_path) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.analysis.outputs.sarif_path }}
          category: duckchat-csharp
